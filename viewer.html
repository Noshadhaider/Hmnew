<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HomeCam</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0 auto;padding:16px;background:#f4f4f2;color:#222;max-width:520px}
  h1{font-size:22px;margin:0 0 12px}
  input{width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid #bbb;border-radius:8px;margin:4px 0}
  button{padding:12px 8px;font-size:15px;border:1px solid #999;border-radius:8px;background:#fff;cursor:pointer}
  button:active{background:#e8e8e8}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #ccc;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
  .dot{width:12px;height:12px;border-radius:50%;background:#aaa;flex:none}
  .dot.on{background:#3b9a2f}
  .grow{flex:1;min-width:0}
  .nm{font-size:17px}
  .sub{font-size:12px;color:#666;margin-top:2px}
  .rm{padding:6px 10px;font-size:12px}
  #stage{position:relative;width:100%;height:320px;background:#ddd;border-radius:12px;overflow:hidden;margin-top:10px}
  #stage img,#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #vid{display:none;background:#000}
  #st{font-size:14px;margin:8px 0}
  #info{font-size:13px;color:#555;margin:6px 0;min-height:18px}
  details{margin-top:14px;font-size:13px}
  #cam{display:none}
</style>
</head>
<body>

<div id="list">
  <h1>Mere camere</h1>
  <div id="devs"><div class="sub">Dhoond raha hoon…</div></div>
  <details>
    <summary>Database ka address</summary>
    <input id="dburl" value="https://cctv-35395-default-rtdb.firebaseio.com">
    <button id="saveDb" style="width:100%">Save karke dobara chalayen</button>
  </details>
</div>

<div id="cam">
  <button id="bBack">&larr; Wapas</button>
  <h1 id="title" style="margin-top:10px"></h1>
  <div id="st"></div>
  <div id="stage">
    <img id="photo" alt="Aakhri photo">
    <video id="vid" autoplay playsinline></video>
  </div>
  <div id="info">Photo ya Live dabayen.</div>
  <div class="row">
    <button id="bPhoto">Photo lo</button>
    <button id="bLive">Live video</button>
    <button id="bMic">Awaaz suno</button>
    <button id="bFace">Camera: peeche wala</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const ROOM = "0t23ziy93k2wz3heyapv6kc4";
const CFG = {
  apiKey: "AIzaSyCpGIpxbReosnWh8oBV6wwXeZzd0kdHq04",
  projectId: "cctv-35395",
  appId: "1:270390449270:android:229b8f4442c0b64b5cbb57"
};
const $ = id => document.getElementById(id);

$("dburl").value = localStorage.getItem("hc_db") || $("dburl").value;
$("saveDb").onclick = () => { localStorage.setItem("hc_db", $("dburl").value.trim()); location.reload(); };

firebase.initializeApp({ ...CFG, databaseURL: $("dburl").value.trim() });
const db = firebase.database();
const devsRef = db.ref("rooms/" + ROOM + "/devices");
let offset = 0, devices = {};
let ref = null, curId = "", facing = "back", mode = "", pc = null, sid = "", lastId = 0, pending = [];
let camTs = 0, camBat = -1, camChg = false, camName = "";

db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; renderList(); renderStatus(); });
devsRef.on("value", s => { devices = s.val() || {}; renderList(); });
setInterval(() => { renderList(); renderStatus(); }, 10000);

function isOnline(ts) { return ts > 0 && (Date.now() + offset - ts) < 60000; }

function renderList() {
  const box = $("devs");
  const ids = Object.keys(devices);
  if (!ids.length) {
    box.innerHTML = '<div class="sub">Abhi koi camera nahi mila. Purane phone par HomeCam kholen.</div>';
    return;
  }
  box.innerHTML = "";
  ids.sort((a, b) => {
    const sa = (devices[a].status || {}), sb = (devices[b].status || {});
    return (isOnline(sb.ts) - isOnline(sa.ts)) || String(sa.name).localeCompare(String(sb.name));
  });
  ids.forEach(id => {
    const st = devices[id].status || {};
    const on = isOnline(st.ts);
    const c = document.createElement("div");
    c.className = "card";
    const bat = st.battery >= 0 ? " | battery " + st.battery + "%" : "";
    c.innerHTML = '<div class="dot' + (on ? " on" : "") + '"></div><div class="grow"><div class="nm"></div><div class="sub">' +
      (on ? "Online" + bat : "Offline") + "</div></div>";
    c.querySelector(".nm").textContent = st.name || "Naam nahi";
    c.onclick = () => openDevice(id, st.name || "Camera");
    if (!on) {
      const r = document.createElement("button");
      r.className = "rm";
      r.textContent = "Hata do";
      r.onclick = e => {
        e.stopPropagation();
        if (confirm("Ye camera list se hata dein?")) devsRef.child(id).remove();
      };
      c.appendChild(r);
    }
    box.appendChild(c);
  });
}

function openDevice(id, name) {
  curId = id;
  ref = devsRef.child(id);
  camName = name;
  camTs = 0; camBat = -1; camChg = false;
  $("title").textContent = name;
  $("list").style.display = "none";
  $("cam").style.display = "block";
  $("photo").removeAttribute("src");
  $("info").textContent = "Photo ya Live dabayen.";
  ref.child("status").on("value", s => {
    const v = s.val() || {};
    camTs = v.ts || 0; camBat = v.battery == null ? -1 : v.battery; camChg = !!v.charging;
    renderStatus();
  });
  ref.child("photo").on("value", s => {
    const v = s.val();
    if (!v || !v.data) return;
    $("photo").src = "data:image/jpeg;base64," + v.data;
    if (!mode) $("info").textContent = "Aakhri photo: " + new Date(v.ts).toLocaleString();
  });
  renderStatus();
}

function closeDevice() {
  stopSession(true);
  if (ref) { ref.child("status").off(); ref.child("photo").off(); }
  ref = null; curId = "";
  $("cam").style.display = "none";
  $("list").style.display = "block";
}
$("bBack").onclick = closeDevice;

function renderStatus() {
  if (!ref) return;
  const on = isOnline(camTs);
  $("st").textContent = on
    ? "Camera online" + (camBat >= 0 ? " | battery " + camBat + "%" : "") + (camChg ? " | charger laga hai" : " | charger NAHI laga")
    : "Camera offline (purana phone band ya internet nahi)";
}

function sendCmd(action, s) {
  if (!ref) return;
  lastId = Math.max(lastId + 1, Date.now());
  ref.child("cmd").set({ id: lastId, action: action, facing: facing, sid: s || "" });
}

$("bPhoto").onclick = () => {
  if (mode) { $("info").textContent = "Pehle live ya awaaz band karen."; return; }
  $("info").textContent = "Photo aa rahi hai…";
  sendCmd("photo", "");
};
$("bLive").onclick = () => toggle("live");
$("bMic").onclick = () => toggle("mic");
$("bFace").onclick = () => {
  facing = facing === "back" ? "front" : "back";
  $("bFace").textContent = facing === "back" ? "Camera: peeche wala" : "Camera: samne wala";
  if (mode) {
    const m = mode;
    stopSession(true);
    setTimeout(() => startSession(m), 1200);
  }
};

function toggle(m) {
  if (mode === m) { stopSession(true); return; }
  const wait = mode ? 800 : 0;
  if (mode) stopSession(true);
  setTimeout(() => startSession(m), wait);
}

function rnd() {
  const c = "abcdefghijklmnopqrstuvwxyz0123456789";
  let r = "";
  for (let i = 0; i < 10; i++) r += c[Math.floor(Math.random() * c.length)];
  return r;
}

function startSession(m) {
  if (!ref) return;
  closePeer();
  mode = m;
  sid = rnd();
  pending = [];
  const base = ref.child("rtc").child(sid);
  const p = new RTCPeerConnection({ iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" }
  ] });
  pc = p;

  p.onicecandidate = e => {
    if (e.candidate) base.child("viewIce").push({
      sdpMid: e.candidate.sdpMid || "",
      sdpMLineIndex: e.candidate.sdpMLineIndex || 0,
      candidate: e.candidate.candidate
    });
  };
  p.ontrack = e => {
    const v = $("vid");
    v.srcObject = e.streams[0] || new MediaStream([e.track]);
    v.play().catch(() => {});
  };
  p.oniceconnectionstatechange = () => {
    if (p !== pc) return;
    const s = p.iceConnectionState;
    if (s === "connected" || s === "completed")
      $("info").textContent = mode === "live" ? "Live chal rahi hai" : "Ghar ki awaaz aa rahi hai";
    else if (s === "failed")
      $("info").textContent = "Connection nahi bana. Mobile data par TURN server chahiye ho sakta hai.";
  };

  base.child("offer").on("value", async s => {
    const v = s.val();
    if (!v || p !== pc || p.remoteDescription) return;
    await p.setRemoteDescription({ type: "offer", sdp: v.sdp });
    const a = await p.createAnswer();
    await p.setLocalDescription(a);
    await base.child("answer").set({ type: "answer", sdp: a.sdp });
    pending.forEach(c => p.addIceCandidate(c).catch(() => {}));
    pending = [];
  });
  base.child("camIce").on("child_added", s => {
    const v = s.val();
    if (!v || p !== pc) return;
    const c = { sdpMid: v.sdpMid, sdpMLineIndex: v.sdpMLineIndex, candidate: v.candidate };
    if (p.remoteDescription) p.addIceCandidate(c).catch(() => {});
    else pending.push(c);
  });

  if (m === "live") {
    $("bLive").textContent = "Live band karo";
    $("vid").style.display = "block";
    $("photo").style.display = "none";
  } else {
    $("bMic").textContent = "Awaaz band karo";
  }
  $("info").textContent = "Purane phone se jur raha hai…";
  sendCmd(m, sid);
}

function closePeer() {
  if (sid && ref) {
    const base = ref.child("rtc").child(sid);
    base.child("offer").off();
    base.child("camIce").off();
    base.remove();
  }
  if (pc) { pc.close(); pc = null; }
  $("vid").srcObject = null;
  sid = "";
  pending = [];
}

function stopSession(tell) {
  if (!mode && !pc) return;
  closePeer();
  mode = "";
  if (tell) sendCmd("stop", "");
  $("bLive").textContent = "Live video";
  $("bMic").textContent = "Awaaz suno";
  $("vid").style.display = "none";
  $("photo").style.display = "block";
  $("info").textContent = "Band kar diya.";
}

window.addEventListener("pagehide", () => { if (mode) stopSession(true); });
</script>
</body>
</html>
