name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Repository ki files:"
          ls -la
          if [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle.kts repository ke root mein nahi hai."
            exit 1
          fi
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json maujood nahi hai."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homecam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
